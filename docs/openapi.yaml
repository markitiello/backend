openapi: 3.0.3
info:
  title: Benzina API
  version: 1.0.0
  description: |
    API dell'app **Benzina**: distributori vicini con il prezzo più basso, media
    nazionale e andamento dei prezzi dei carburanti in Italia.

    I prezzi sono gli open data del MIMIT (Osservaprezzi Carburanti), aggiornati
    una volta al giorno; valutazioni e recensioni vengono da Google Places.

    **Accesso**: tutte le rotte `/v1` richiedono l'header `X-Firebase-AppCheck`
    (token Firebase App Check dell'app) oppure `X-API-Key`. Vedi `docs/API.md`.
  license:
    name: "Dati prezzi: MIMIT, licenza IODL 2.0"
servers:
  - url: /
security:
  - AppCheck: []
  - ApiKey: []
tags:
  - name: Distributori
  - name: Andamento prezzi
  - name: Servizio

paths:
  /health:
    get:
      tags: [Servizio]
      summary: Stato del servizio
      description: Non richiede autenticazione. `data_date` è il giorno dell'ultimo import MIMIT.
      operationId: health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/stations/nearby:
    get:
      tags: [Distributori]
      summary: Distributori vicini, dal più economico
      description: |
        Distributori entro `radius_km` che vendono `fuel`, con il prezzo dell'ultimo
        aggiornamento MIMIT e la media nazionale per il confronto. A parità di
        prezzo viene prima il più vicino.
      operationId: stationsNearby
      parameters:
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lng"
        - $ref: "#/components/parameters/RadiusKm"
        - $ref: "#/components/parameters/Fuel"
        - $ref: "#/components/parameters/Mode"
        - name: limit
          in: query
          description: Numero massimo di risultati.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NearbyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/InvalidParameters" }

  /v1/stations:
    get:
      tags: [Distributori]
      summary: Più distributori per id
      description: Per la schermata Preferiti. Gli id che non esistono (es. distributori chiusi) vengono omessi.
      operationId: stationsList
      parameters:
        - name: ids
          in: query
          required: true
          description: Fino a 50 id separati da virgola.
          schema: { type: string, pattern: '^\d+(,\d+){0,49}$' }
          example: "3464,3468"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/InvalidParameters" }

  /v1/stations/{station_id}:
    get:
      tags: [Distributori]
      summary: Dettaglio di un distributore
      operationId: stationDetail
      parameters:
        - $ref: "#/components/parameters/StationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/stations/{station_id}/trend:
    get:
      tags: [Andamento prezzi]
      summary: Storico prezzi di un distributore
      description: |
        Prezzo a fine giornata: l'ultimo comunicato dal gestore entro quel giorno.
        Mancano i giorni precedenti al primo prezzo noto.
      operationId: stationTrend
      parameters:
        - $ref: "#/components/parameters/StationId"
        - $ref: "#/components/parameters/Fuel"
        - $ref: "#/components/parameters/Mode"
        - $ref: "#/components/parameters/Days"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trend" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/InvalidParameters" }

  /v1/stations/{station_id}/google-rating:
    get:
      tags: [Distributori]
      summary: Valutazione e recensioni Google
      description: |
        Dati di Google Places. Nell'app vanno mostrati con il testo di `attribution`
        e con il nome (e link) dell'autore di ogni recensione.

        - 404: distributore inesistente o nessun luogo Google abbinato.
        - 503: integrazione Google non configurata sul server.
      operationId: stationGoogleRating
      parameters:
        - $ref: "#/components/parameters/StationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleRating" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/trends/national:
    get:
      tags: [Andamento prezzi]
      summary: Media nazionale giornaliera
      description: |
        Media dei prezzi di tutti i distributori d'Italia, un punto per giorno di
        import. Esclusi i prezzi comunicati da oltre 30 giorni e i valori anomali.
      operationId: trendNational
      parameters:
        - $ref: "#/components/parameters/Fuel"
        - $ref: "#/components/parameters/Mode"
        - $ref: "#/components/parameters/Days"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trend" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/InvalidParameters" }

  /v1/trends/area:
    get:
      tags: [Andamento prezzi]
      summary: Media giornaliera della zona
      description: Media dei distributori entro `radius_km`, per confrontarla con quella nazionale.
      operationId: trendArea
      parameters:
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lng"
        - $ref: "#/components/parameters/RadiusKm"
        - $ref: "#/components/parameters/Fuel"
        - $ref: "#/components/parameters/Mode"
        - $ref: "#/components/parameters/Days"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trend" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/InvalidParameters" }

  /v1/trends/alerts:
    get:
      tags: [Andamento prezzi]
      summary: Tendenze dei prezzi segnalate
      description: |
        Tendenze della media nazionale rilevate dopo gli import (le stesse inviate
        come notifiche push ai topic `trend_*`), dalla più recente. Una tendenza
        inizia quando la media sale o scende per 3 giorni di fila di almeno lo 0,5%
        complessivo; dopo un avviso, per 7 giorni non ne arriva un altro nella
        stessa direzione.
      operationId: trendAlerts
      parameters:
        - name: fuel
          in: query
          description: Solo questo carburante. Se assente, tutti.
          schema: { $ref: "#/components/schemas/Fuel" }
        - name: days
          in: query
          description: Avvisi degli ultimi N giorni, oggi incluso.
          schema: { type: integer, minimum: 1, maximum: 366, default: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendAlertList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/InvalidParameters" }

components:
  securitySchemes:
    AppCheck:
      type: apiKey
      in: header
      name: X-Firebase-AppCheck
      description: Token Firebase App Check dell'app (produzione).
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Chiave statica per sviluppo e chiamate da server.

  parameters:
    Lat:
      name: lat
      in: query
      required: true
      description: Latitudine (WGS84).
      schema: { type: number, minimum: -90, maximum: 90 }
      example: 45.4781
    Lng:
      name: lng
      in: query
      required: true
      description: Longitudine (WGS84).
      schema: { type: number, minimum: -180, maximum: 180 }
      example: 9.227
    RadiusKm:
      name: radius_km
      in: query
      description: Raggio di ricerca in km.
      schema: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 50, default: 5 }
    Fuel:
      name: fuel
      in: query
      description: Carburante.
      schema: { $ref: "#/components/schemas/Fuel" }
    Mode:
      name: mode
      in: query
      description: "`self` o `servito`. Ignorato per GPL e metano (si usa `any`)."
      schema: { $ref: "#/components/schemas/Mode" }
    Days:
      name: days
      in: query
      description: Numero di giorni, oggi incluso.
      schema: { type: integer, minimum: 2, maximum: 366, default: 30 }
    StationId:
      name: station_id
      in: path
      required: true
      description: "`idImpianto` del MIMIT."
      schema: { type: integer, minimum: 0 }
      example: 3464

  responses:
    Unauthorized:
      description: Non autorizzato
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Non trovato
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InvalidParameters:
      description: Parametri non validi
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadGateway:
      description: Servizio esterno non disponibile
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: Servizio non disponibile
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Fuel:
      type: string
      enum: [benzina, diesel, gpl, metano]
      default: benzina
    Mode:
      type: string
      enum: [self, servito, any]
      default: self
      description: "`any` = self e servito insieme (GPL e metano)."

    Problem:
      type: object
      description: Errore nel formato RFC 9457.
      required: [type, title, status]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Non autorizzato }
        status: { type: integer, example: 401 }
        detail: { type: string, nullable: true, example: Token App Check mancante o non valido. }

    Health:
      type: object
      required: [status, data_date]
      properties:
        status: { type: string, example: ok }
        data_date: { type: string, format: date, nullable: true, example: "2026-09-25" }

    Price:
      type: object
      required: [fuel, mode, price, reported_at]
      properties:
        fuel: { $ref: "#/components/schemas/Fuel" }
        mode:
          type: string
          enum: [self, servito]
        price:
          type: number
          description: "€/l (€/kg per il metano)."
          example: 1.739
        reported_at:
          type: string
          format: date-time
          description: "Quando il gestore ha comunicato il prezzo (ora italiana, con fuso)."
          example: "2026-09-24T19:00:00+02:00"

    StationSummary:
      type: object
      required: [id, brand, name, address, city, province, lat, lng]
      properties:
        id:
          type: integer
          description: "`idImpianto` del MIMIT."
          example: 3464
        brand: { type: string, example: Agip Eni }
        name: { type: string, example: 19829 AGRIGENTO }
        address: { type: string, example: SS.189 KM. 64+649 }
        city: { type: string, example: AGRIGENTO }
        province: { type: string, example: AG }
        lat: { type: number, example: 37.333935 }
        lng: { type: number, example: 13.595533 }

    Station:
      allOf:
        - $ref: "#/components/schemas/StationSummary"
        - type: object
          required: [operator, kind, prices]
          properties:
            operator:
              type: string
              description: "Gestore."
            kind:
              type: string
              description: "`Stradale` o `Autostradale`."
            prices:
              type: array
              description: Prezzi dell'ultimo aggiornamento.
              items: { $ref: "#/components/schemas/Price" }
            details:
              allOf:
                - $ref: "#/components/schemas/StationDetails"
              nullable: true
              description: |
                Orari, servizi e contatti da Osservaprezzi (con BENZINA_LIVE_PRICES
                attivo, dopo la prima apertura del dettaglio). `null` se non ancora noti.

    StationDetails:
      type: object
      required: [phone, email, website, services, opening_hours]
      properties:
        phone: { type: string, nullable: true, example: 366 6286969 }
        email: { type: string, nullable: true }
        website: { type: string, nullable: true }
        services:
          type: array
          description: Come li indica il gestore, es. Bancomat, Food&Beverage, Wi-Fi.
          items: { type: string }
          example: [Bancomat, Food&Beverage, Servizi per disabili]
        opening_hours:
          type: array
          description: |
            Solo i giorni comunicati. `day`: 1 lunedì … 7 domenica, 8 festivi.
            `hours`: "07:00–18:30", "08:00–12:30, 15:00–19:00", "24 ore" o "Chiuso".
          items:
            type: object
            required: [day, hours]
            properties:
              day: { type: integer, minimum: 1, maximum: 8 }
              hours: { type: string, example: 07:00–18:30 }

    Offer:
      type: object
      required: [station, price, mode, reported_at, distance_km]
      properties:
        station: { $ref: "#/components/schemas/StationSummary" }
        price: { type: number, example: 1.739 }
        mode:
          type: string
          enum: [self, servito]
        reported_at: { type: string, format: date-time }
        distance_km: { type: number, example: 1.2 }

    NearbyResponse:
      type: object
      required: [fuel, mode, data_date, national_average, offers]
      properties:
        fuel: { $ref: "#/components/schemas/Fuel" }
        mode: { $ref: "#/components/schemas/Mode" }
        data_date:
          type: string
          format: date
          nullable: true
          description: "Giorno dell'ultimo aggiornamento MIMIT."
        national_average:
          type: number
          nullable: true
          description: "Media nazionale dello stesso giorno, carburante e modalità."
        offers:
          type: array
          description: Dal più economico; a parità di prezzo il più vicino.
          items: { $ref: "#/components/schemas/Offer" }

    StationList:
      type: object
      required: [stations]
      properties:
        stations:
          type: array
          items: { $ref: "#/components/schemas/Station" }

    TrendPoint:
      type: object
      required: [day, price]
      properties:
        day: { type: string, format: date }
        price: { type: number }

    Trend:
      type: object
      required: [fuel, mode, points]
      properties:
        fuel: { $ref: "#/components/schemas/Fuel" }
        mode: { $ref: "#/components/schemas/Mode" }
        points:
          type: array
          description: Un punto per giorno, dal più vecchio.
          items: { $ref: "#/components/schemas/TrendPoint" }

    Review:
      type: object
      required: [author, author_uri, rating, relative_time, text]
      properties:
        author: { type: string }
        author_uri:
          type: string
          nullable: true
          description: "Profilo Google dell'autore (da mostrare)."
        rating: { type: integer, minimum: 1, maximum: 5 }
        relative_time: { type: string, example: 2 settimane fa }
        text: { type: string }

    GoogleRating:
      type: object
      required: [place_id, rating, rating_count, maps_url, reviews, attribution]
      properties:
        place_id: { type: string }
        rating: { type: number, nullable: true, example: 4.3 }
        rating_count: { type: integer, example: 212 }
        maps_url:
          type: string
          nullable: true
          description: "Pagina del luogo su Google Maps."
        reviews:
          type: array
          description: Al massimo 5, scelte da Google.
          items: { $ref: "#/components/schemas/Review" }
        attribution:
          type: string
          description: Testo di attribuzione obbligatorio da mostrare nell'app.
          example: Valutazioni e recensioni fornite da Google

    TrendAlert:
      type: object
      required: [fuel, mode, day, direction, days, change, price, title, body, topic, sent_at]
      properties:
        fuel: { $ref: "#/components/schemas/Fuel" }
        mode: { $ref: "#/components/schemas/Mode" }
        day: { type: string, format: date, description: "Giorno in cui la tendenza è stata rilevata." }
        direction:
          type: string
          enum: [up, down]
          description: "`up` prezzi in aumento, `down` in calo."
        days: { type: integer, description: "Giorni consecutivi di aumento o calo.", example: 3 }
        change: { type: number, description: "Variazione complessiva (−0.012 = −1,2%).", example: -0.012 }
        price: { type: number, description: "Media nazionale del giorno.", example: 1.819 }
        title: { type: string, example: Benzina self in calo }
        body: { type: string, example: "Media nazionale 1,819 €/l: −1,2% in 3 giorni." }
        topic: { type: string, description: "Topic FCM a cui è stata inviata la notifica.", example: trend_benzina_self }
        sent_at:
          type: string
          format: date-time
          nullable: true
          description: "Quando è stata inviata la notifica push (ora italiana, con fuso); null se non ancora inviata."
          example: "2026-09-26T09:15:04+02:00"

    TrendAlertList:
      type: object
      required: [alerts]
      properties:
        alerts:
          type: array
          items: { $ref: "#/components/schemas/TrendAlert" }
