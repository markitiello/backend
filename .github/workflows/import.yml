name: Import MIMIT

# Alternativa al cron dell'hosting. Ogni giorno dopo la pubblicazione dei
# prezzi "alle 8": 07:30 UTC = 09:30 in estate, 08:30 in inverno.
# Il database deve essere raggiungibile da GitHub.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pdo_mysql
      - run: composer install --no-dev --no-interaction --no-progress
      - run: php bin/import.php
        env:
          BENZINA_DB_DSN: ${{ secrets.BENZINA_DB_DSN }}
          BENZINA_DB_USER: ${{ secrets.BENZINA_DB_USER }}
          BENZINA_DB_PASSWORD: ${{ secrets.BENZINA_DB_PASSWORD }}
          # Facoltativo: JSON del service account Firebase per le notifiche push.
          BENZINA_FCM_CREDENTIALS: ${{ secrets.BENZINA_FCM_CREDENTIALS }}
