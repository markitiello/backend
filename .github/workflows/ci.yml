name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.4"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: benzina_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: benzina_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql, pdo_mysql
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - name: Test (SQLite)
        run: vendor/bin/phpunit
      - name: Test (PostgreSQL)
        run: vendor/bin/phpunit
        env:
          BENZINA_TEST_DB_DSN: pgsql:host=127.0.0.1;port=5432;dbname=benzina_test
          BENZINA_TEST_DB_USER: postgres
          BENZINA_TEST_DB_PASSWORD: postgres
      - name: Test (MariaDB)
        run: vendor/bin/phpunit
        env:
          BENZINA_TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=benzina_test;charset=utf8mb4
          BENZINA_TEST_DB_USER: root
          BENZINA_TEST_DB_PASSWORD: root
